  <script>
    // globalThis exists from Chrome 71; older system WebViews (e.g. 64-70) would stop the whole bundle on it.
    if (typeof globalThis === 'undefined') { window.globalThis = window; }
    // Fill-only polyfills for APIs missing in older system WebViews. Each runs only when the API is absent,
    // so current WebViews are unaffected. Covered by tests/legacy-polyfills.test.mjs.
    (function () {
      try {
        if (!Object.fromEntries) {
          Object.fromEntries = function (it) { var o = {}; for (var e of it) { Object.defineProperty(o, e[0], { value: e[1], writable: true, enumerable: true, configurable: true }); } return o; };
        }
        if (!Promise.allSettled) {
          Promise.allSettled = function (ps) {
            return Promise.all(Array.from(ps, function (p) {
              return Promise.resolve(p).then(
                function (value) { return { status: 'fulfilled', value: value }; },
                function (reason) { return { status: 'rejected', reason: reason }; });
            }));
          };
        }
        if (window.crypto && !window.crypto.randomUUID && window.crypto.getRandomValues) {
          window.crypto.randomUUID = function () {
            var b = new Uint8Array(16); window.crypto.getRandomValues(b);
            b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
            var h = Array.prototype.map.call(b, function (x) { return (x + 256).toString(16).slice(1); }).join('');
            return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
          };
        }
      } catch (e) { /* never block startup */ }
    })();
  </script>
