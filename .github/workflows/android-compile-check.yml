name: Phase 3 Android compile only

# Verification only. No signing secrets, APK/AAB packaging, uploads, or releases.
on:
  push:
    branches: [feat/mastery-phase-3]
    paths:
      - '.github/workflows/android-compile-check.yml'
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package*.json'
      - '*config*'
  pull_request:
    branches: [feat/mastery-phase-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-android-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Build local-only web assets and sync Capacitor
        env:
          VITE_LOCAL_ONLY: 'true'
        run: npm run build:android
      - name: Install compile SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Compile debug Java without packaging or signing
        run: |
          chmod +x android/gradlew
          ./android/gradlew -p android :app:compileDebugJavaWithJavac --no-daemon --stacktrace
