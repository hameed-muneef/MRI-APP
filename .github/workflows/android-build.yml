# بناء تطبيق الأندرويد (Capacitor) — APK للتجربة و AAB/APK للنشر على متجر Play
# يعمل: يدويًا (workflow_dispatch) أو عند الدفع إلى main / hameed/mobile-app أو وسم app-v*
# التوقيع: ضع هذه الأسرار في إعدادات المستودع (Settings → Secrets → Actions):
#   KEYSTORE_BASE64  — ملف المفاتيح بترميز base64 (base64 -w0 release.keystore)
#   KEYSTORE_PASSWORD، KEY_ALIAS، KEY_PASSWORD
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - hameed/mobile-app
    tags:
      - 'app-v*'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and run unit tests
        run: |
          npm run lint
          npm run test:unit

      - name: Database tests (all migrations applied to an in-process Postgres; RLS, grants, payment operations)
        run: npm test

      - name: Check optional bundled Adhan audio assets (bundled in public/sounds/adhan + res/raw)
        run: |
          missing=0
          for f in adhan_almulla.ogg adhan_madinah.ogg adhan_madinah2.ogg adhan_mohammed.ogg adhan_ahmad.ogg adhan_hamad.ogg takbeerat_eid.ogg; do
            if [ ! -s "public/sounds/adhan/$f" ] || [ ! -s "android/app/src/main/res/raw/$f" ]; then
              echo "::warning::Optional Adhan audio '$f' is missing (expected both public/sounds/adhan and res/raw); app falls back to default notification sound or built-in chime."
              missing=$((missing + 1))
            fi
          done
          echo "Optional missing Adhan audio checks: $missing"

      - name: Build web assets, generate icons/splash, and sync Capacitor (Local-Only)
        env:
          VITE_LOCAL_ONLY: 'true'
        run: npm run build:android

      - name: Verify required Android resources and Capacitor setup
        run: |
          test -s "android/app/src/main/res/drawable/splash.png"
          test -s "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"
          test -s "android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png"
          test -s "android/app/src/main/assets/public/index.html"
          npx cap doctor android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK components (platforms;android-36, build-tools 36.0.0)
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" 2>&1 | tail -20
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradle executable
        run: chmod +x android/gradlew

      - name: Native unit tests (Java prayer-time + alarm-plan parity against the JS scheduler)
        run: |
          node scripts/gen-native-plan-parity.cjs
          ./android/gradlew -p android testDebugUnitTest --no-daemon

      - name: Build debug APK (للتجربة الفورية)
        run: ./android/gradlew -p android assembleDebug --no-daemon

      - name: Build signed release AAB and APK (متطلب متجر Play)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./android/gradlew -p android bundleRelease assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2

      - name: Upload signed release AAB
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 2

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 2
